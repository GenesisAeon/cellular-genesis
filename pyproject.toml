[project]
name = "cellular-genesis"
version = "0.1.1"
description = "GenesisAeon Entropy Atlas Package 25 — Apoptosis / Programmed Cell Death ATP Threshold"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Johann Roemer", affiliation = "MOR Research Collective" }]
requires-python = ">=3.11"
keywords = [
    "apoptosis", "ATP threshold", "UTAC", "CREP", "caspase",
    "mitochondria", "programmed cell death", "GenesisAeon", "entropy atlas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
cellular = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[project.urls]
Homepage = "https://github.com/GenesisAeon/cellular-genesis"
Repository = "https://github.com/GenesisAeon/cellular-genesis"
Issues = "https://github.com/GenesisAeon/cellular-genesis/issues"
Zenodo = "https://doi.org/10.5281/zenodo.19645351"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cellular_genesis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
